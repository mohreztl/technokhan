packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10 blocks dependency build scripts by default. These six need theirs:
# sharp compiles/downloads its libvips binary (the asset generator and Next's
# image optimiser use it), Prisma downloads its query engine and generates the
# client, esbuild and unrs-resolver install their platform binaries.
onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
  - sharp
  - unrs-resolver
