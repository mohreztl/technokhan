services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: autolounge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autolounge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autolounge_password}
      POSTGRES_DB: ${POSTGRES_DB:-autolounge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - autolounge-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autolounge}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service (Fastify) — runs `prisma migrate deploy` (+ optional seed) on start
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: autolounge-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      HOST: 0.0.0.0
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-autolounge}:${POSTGRES_PASSWORD:-autolounge_password}@postgres:5432/${POSTGRES_DB:-autolounge}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://web:3000}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      PAYMENT_CALLBACK_URL: ${PAYMENT_CALLBACK_URL:-http://localhost:3000/checkout/callback}
      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID:-}
      ZARINPAL_SANDBOX: ${ZARINPAL_SANDBOX:-true}
      MELIPAYAMAK_USERNAME: ${MELIPAYAMAK_USERNAME:-}
      MELIPAYAMAK_PASSWORD: ${MELIPAYAMAK_PASSWORD:-}
      MELIPAYAMAK_FROM: ${MELIPAYAMAK_FROM:-}
      OTP_DEV_BYPASS_CODE: ${OTP_DEV_BYPASS_CODE:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-09120000000}
      SEED_ON_START: ${SEED_ON_START:-true}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - autolounge-network
    volumes:
      - api_uploads:/app/apps/api/uploads

  # Web Service (Next.js) — NEXT_PUBLIC_* values are baked in at build time
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
    container_name: autolounge-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # API URL for client-side requests (browser)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEMO_MODE: ${NEXT_PUBLIC_DEMO_MODE:-false}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      # Internal API URL for server-side requests
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://api:5000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    networks:
      - autolounge-network

  # Nginx Reverse Proxy (Optional) — `docker compose --profile with-nginx up`
  nginx:
    image: nginx:alpine
    container_name: autolounge-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - autolounge-network
    profiles:
      - with-nginx

networks:
  autolounge-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  api_uploads:
    driver: local
