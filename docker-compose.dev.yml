version: '3.8'

services:
  # PostgreSQL Database for Development
  postgres:
    image: postgres:16-alpine
    container_name: autolounge-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autolounge_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-autolounge_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - autolounge-dev-network

  # Redis for caching (optional for development)
  redis:
    image: redis:7-alpine
    container_name: autolounge-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - autolounge-dev-network
    profiles:
      - with-redis

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: autolounge-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - autolounge-dev-network
    profiles:
      - with-admin

networks:
  autolounge-dev-network:
    driver: bridge

volumes:
  postgres_dev_data:
    driver: local
